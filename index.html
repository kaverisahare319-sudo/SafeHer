<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#050509" />
    <meta name="description" content="SafeHer - Women's Personal Safety, Live Location Sharing, SOS Emergency Alert App" />
    <link rel="manifest" href="/manifest.json" />
    <title>SafeHer - Women's Personal Safety & Emergency SOS</title>
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Tailwind CSS CDN with configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              neonPink: {
                DEFAULT: '#FF10F0',
                50: '#fff0fe',
                100: '#ffe0fd',
                200: '#ffc2fb',
                300: '#ff8cf7',
                400: '#ff46f3',
                500: '#FF10F0',
                600: '#d900c9',
                700: '#b000a0',
                800: '#900381',
                900: '#750968',
              },
              darkBg: '#050509',
              darkCard: '#0d0d16',
            },
            boxShadow: {
              'neon': '0 0 25px rgba(255, 16, 240, 0.6), 0 0 50px rgba(255, 16, 240, 0.3)',
              'neon-strong': '0 0 35px #FF10F0, 0 0 70px rgba(255, 16, 240, 0.6), inset 0 0 20px rgba(255, 16, 240, 0.4)',
            }
          }
        }
      }
    </script>

    <!-- React 18 & ReactDOM 18 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Babel Standalone for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        background-color: #050509;
        color: #e4e4e7;
        font-family: 'Outfit', sans-serif;
      }
      .glass-panel {
        background: rgba(13, 13, 22, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 16, 240, 0.18);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      }
      .sos-button-glow {
        background: radial-gradient(circle, #ff5cf4 0%, #FF10F0 45%, #ca00bb 100%);
        box-shadow: 
          0 0 25px #FF10F0,
          0 0 50px rgba(255, 16, 240, 0.7),
          0 0 90px rgba(255, 16, 240, 0.4),
          inset 0 0 20px rgba(255, 255, 255, 0.4);
      }
      .sos-ring-1 {
        border: 2px solid rgba(255, 16, 240, 0.6);
        animation: sosPulseRing 2.4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
      .sos-ring-2 {
        border: 2px solid rgba(255, 16, 240, 0.4);
        animation: sosPulseRing 2.4s cubic-bezier(0.215, 0.61, 0.355, 1) 0.8s infinite;
      }
      @keyframes sosPulseRing {
        0% { transform: scale(0.9); opacity: 0.9; }
        50% { opacity: 0.4; }
        100% { transform: scale(1.6); opacity: 0; }
      }
      .leaflet-container {
        background: #09090e !important;
        font-family: 'Outfit', sans-serif !important;
        border-radius: 1rem;
      }
      .leaflet-tile {
        filter: brightness(0.75) contrast(1.25) saturate(0.8) hue-rotate(290deg);
      }
      @keyframes strobe {
        0%, 100% { background-color: #ffffff; color: #000000; }
        50% { background-color: #FF10F0; color: #ffffff; }
      }
      .animate-strobe {
        animation: strobe 0.15s infinite;
      }
    </style>
  </head>
  <body class="bg-[#050509] text-gray-100 font-['Outfit',sans-serif] antialiased selection:bg-[#FF10F0] selection:text-black overflow-x-hidden min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef, useCallback } = React;

      // --- Web Audio Siren Synth ---
      let audioCtx = null;
      let osc1 = null;
      let isSirenPlaying = false;
      let sirenInterval = null;

      const audioSiren = {
        start: () => {
          if (isSirenPlaying) return;
          try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.connect(audioCtx.destination);
            osc1 = audioCtx.createOscillator();
            osc1.type = 'sawtooth';
            osc1.connect(gain);
            osc1.start();
            isSirenPlaying = true;
            let high = false;
            sirenInterval = setInterval(() => {
              if (!audioCtx || !osc1) return;
              osc1.frequency.setValueAtTime(high ? 850 : 1250, audioCtx.currentTime);
              high = !high;
            }, 350);
          } catch(e) { console.error(e); }
        },
        stop: () => {
          if (!isSirenPlaying) return;
          if (sirenInterval) clearInterval(sirenInterval);
          try {
            if (osc1) { osc1.stop(); osc1.disconnect(); }
            if (audioCtx) { audioCtx.close(); }
          } catch(e) {}
          osc1 = null; audioCtx = null; isSirenPlaying = false;
        },
        playBeep: (freq = 880, dur = 150) => {
          try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start();
            setTimeout(() => { osc.stop(); ctx.close(); }, dur);
          } catch(e) {}
        }
      };

      // --- Helpers ---
      const createGoogleMapsUrl = (lat, lng) => `https://www.google.com/maps?q=${lat},${lng}`;
      const createEmergencyMessage = (lat, lng, address = '') => {
        const url = createGoogleMapsUrl(lat, lng);
        const locStr = address ? `📍 Location: ${address}\n🔗 Maps: ${url}` : `🔗 Live Location: ${url}`;
        return `🚨 EMERGENCY SOS ALERT! 🚨\nI am in danger and need urgent assistance!\n\n${locStr}\n\nPlease help or contact emergency services immediately!`;
      };
      const getWhatsAppUrl = (phone, msg) => {
        const clean = phone ? phone.replace(/\D/g, '') : '';
        const enc = encodeURIComponent(msg);
        return clean ? `https://wa.me/${clean}?text=${enc}` : `https://api.whatsapp.com/send?text=${enc}`;
      };
      const getSmsUrl = (phone, msg) => {
        const clean = phone ? phone.replace(/\D/g, '') : '';
        return `sms:${clean}?body=${encodeURIComponent(msg)}`;
      };

      // --- Main App Component ---
      function App() {
        const [activeTab, setActiveTab] = useState('sos');
        const [location, setLocation] = useState({ latitude: 28.6139, longitude: 77.2090, accuracy: 15 });
        const [address, setAddress] = useState('Acquiring location...');
        const [locationLoading, setLocationLoading] = useState(false);
        const [locationError, setLocationError] = useState(null);
        const [isSosModalOpen, setIsSosModalOpen] = useState(false);
        const [isSirenActive, setIsSirenActive] = useState(false);
        const [deferredPrompt, setDeferredPrompt] = useState(null);

        // Emergency Contacts in localStorage
        const defaultContacts = [
          { id: '1', name: 'Mom', phone: '+1 800 555 0199', relation: 'Parent', isPrimary: true },
          { id: '2', name: 'Sarah (Friend)', phone: '+1 800 555 0188', relation: 'Friend', isPrimary: false },
          { id: '3', name: 'Police Emergency', phone: '112', relation: 'Police', isPrimary: false }
        ];

        const [contacts, setContacts] = useState(() => {
          try {
            const item = localStorage.getItem('safeher_contacts');
            return item ? JSON.parse(item) : defaultContacts;
          } catch(e) { return defaultContacts; }
        });

        useEffect(() => {
          localStorage.setItem('safeher_contacts', JSON.stringify(contacts));
        }, [contacts]);

        // Geolocation
        const fetchLocation = useCallback(() => {
          if (!navigator.geolocation) {
            setLocationError('Geolocation not supported');
            return;
          }
          setLocationLoading(true);
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const coords = {
                latitude: pos.coords.latitude,
                longitude: pos.coords.longitude,
                accuracy: pos.coords.accuracy
              };
              setLocation(coords);
              setLocationLoading(false);
              // Reverse Geocode
              fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${coords.latitude}&lon=${coords.longitude}&zoom=18`)
                .then(r => r.json())
                .then(d => { if (d && d.display_name) setAddress(d.display_name); })
                .catch(() => setAddress(`Lat: ${coords.latitude.toFixed(4)}, Lng: ${coords.longitude.toFixed(4)}`));
            },
            (err) => {
              setLocationLoading(false);
              setLocationError('Enable Location Access');
            },
            { enableHighAccuracy: true, timeout: 10000 }
          );
        }, []);

        useEffect(() => {
          fetchLocation();
          const pwaHandler = (e) => { e.preventDefault(); setDeferredPrompt(e); };
          window.addEventListener('beforeinstallprompt', pwaHandler);
          return () => window.removeEventListener('beforeinstallprompt', pwaHandler);
        }, [fetchLocation]);

        useEffect(() => {
          if (window.lucide && typeof window.lucide.createIcons === 'function') {
            window.lucide.createIcons();
          }
        });

        const toggleSiren = () => {
          if (isSirenActive) {
            audioSiren.stop();
            setIsSirenActive(false);
          } else {
            audioSiren.start();
            setIsSirenActive(true);
          }
        };

        const triggerSos = () => {
          fetchLocation();
          setIsSosModalOpen(true);
        };

        return (
          <div className="min-h-screen flex flex-col justify-between pb-24">
            
            {/* Header */}
            <header className="sticky top-0 z-40 w-full glass-panel border-b border-[#FF10F0]/20 px-4 py-3 bg-[#050509]/80 backdrop-blur-md">
              <div className="max-w-4xl mx-auto flex items-center justify-between">
                <div className="flex items-center gap-2.5">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-[#FF10F0] to-[#FF007F] p-0.5 shadow-[0_0_15px_#FF10F0] flex items-center justify-center">
                    <div className="w-full h-full bg-[#050509] rounded-[10px] flex items-center justify-center">
                      <i data-lucide="shield-alert" className="w-6 h-6 text-[#FF10F0] animate-pulse"></i>
                    </div>
                  </div>
                  <div>
                    <h1 className="text-xl font-extrabold tracking-tight text-white">
                      Safe<span className="text-[#FF10F0] drop-shadow-[0_0_10px_#FF10F0]">Her</span>
                    </h1>
                    <p className="text-[11px] text-gray-400 font-medium">Personal Safety System</p>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <span className={`px-2.5 py-1 rounded-full text-xs font-semibold border ${locationError ? 'bg-red-500/10 text-red-400 border-red-500/30' : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30'}`}>
                    {locationError ? 'GPS Error' : 'GPS Active'}
                  </span>

                  <button
                    onClick={toggleSiren}
                    className={`px-3 py-1.5 rounded-xl border text-xs font-bold transition-all flex items-center gap-1 ${isSirenActive ? 'bg-red-600 text-white animate-pulse shadow-[0_0_20px_red]' : 'bg-white/5 text-gray-300 border-white/10 hover:border-[#FF10F0]'}`}
                  >
                    {isSirenActive ? 'STOP SIREN' : 'SIREN'}
                  </button>
                </div>
              </div>
            </header>

            {/* Main View */}
            <main className="max-w-4xl w-full mx-auto px-4 py-4 flex-1">
              
              {/* SOS Tab */}
              {activeTab === 'sos' && (
                <div className="space-y-6">
                  <div className="glass-panel p-8 rounded-3xl border border-[#FF10F0]/30 shadow-[0_0_35px_rgba(255,16,240,0.15)] text-center relative">
                    <div className="flex flex-col items-center justify-center my-4 relative">
                      <div className="relative flex items-center justify-center">
                        <div className="absolute w-56 h-56 rounded-full sos-ring-1 pointer-events-none" />
                        <div className="absolute w-72 h-72 rounded-full sos-ring-2 pointer-events-none" />
                        <button
                          onClick={() => { audioSiren.playBeep(900, 200); triggerSos(); }}
                          className="relative z-10 w-48 h-48 sm:w-56 sm:h-56 rounded-full sos-button-glow flex flex-col items-center justify-center cursor-pointer transition-all duration-300 active:scale-95 border-4 border-white/80"
                        >
                          <span className="text-4xl sm:text-5xl font-black text-white font-['Outfit'] drop-shadow-[0_4px_16px_rgba(0,0,0,0.9)]">
                            SOS
                          </span>
                          <span className="text-[11px] font-extrabold uppercase tracking-widest text-pink-100 bg-black/40 px-3 py-1 rounded-full backdrop-blur-md mt-2 border border-white/30">
                            TAP FOR HELP
                          </span>
                        </button>
                      </div>
                      <div className="mt-8 text-center max-w-sm">
                        <p className="text-xs text-gray-400 bg-white/5 p-2.5 rounded-xl border border-white/10">
                          📍 Location: <span className="text-gray-200">{address}</span>
                        </p>
                      </div>
                    </div>
                  </div>

                  {/* Navigation Grid */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <button onClick={() => setActiveTab('map')} className="glass-panel p-4 rounded-2xl border border-white/10 hover:border-[#FF10F0] text-center font-bold text-xs text-white">
                      🗺️ Live Map
                    </button>
                    <button onClick={() => setActiveTab('contacts')} className="glass-panel p-4 rounded-2xl border border-white/10 hover:border-[#FF10F0] text-center font-bold text-xs text-white">
                      👥 Contacts ({contacts.length})
                    </button>
                    <button onClick={() => setActiveTab('checkin')} className="glass-panel p-4 rounded-2xl border border-white/10 hover:border-[#FF10F0] text-center font-bold text-xs text-white">
                      ⏱️ Safety Timer
                    </button>
                    <button onClick={() => setActiveTab('helplines')} className="glass-panel p-4 rounded-2xl border border-white/10 hover:border-[#FF10F0] text-center font-bold text-xs text-white">
                      📞 Quick Helplines
                    </button>
                  </div>
                </div>
              )}

              {/* Map Tab */}
              {activeTab === 'map' && (
                <div className="space-y-4">
                  <div className="glass-panel p-4 rounded-2xl flex items-center justify-between">
                    <div>
                      <h3 className="text-base font-bold text-white">Live Location Tracking</h3>
                      <p className="text-xs text-gray-400">{address}</p>
                    </div>
                    <button onClick={fetchLocation} className="px-3 py-1.5 rounded-xl bg-[#FF10F0]/20 text-[#FF10F0] border border-[#FF10F0] text-xs font-bold">
                      Refresh GPS
                    </button>
                  </div>
                  <div className="relative w-full h-[400px] rounded-2xl overflow-hidden glass-panel border border-[#FF10F0]/30">
                    <iframe
                      width="100%"
                      height="100%"
                      frameBorder="0"
                      src={`https://maps.google.com/maps?q=${location?.latitude || 28.6139},${location?.longitude || 77.2090}&z=15&output=embed`}
                    ></iframe>
                  </div>
                </div>
              )}

              {/* Contacts Tab */}
              {activeTab === 'contacts' && (
                <div className="space-y-4">
                  <div className="glass-panel p-4 rounded-2xl flex items-center justify-between">
                    <h3 className="text-base font-bold text-white">Trusted Emergency Contacts</h3>
                    <button
                      onClick={() => {
                        const name = prompt('Contact Name:');
                        const phone = prompt('Phone Number:');
                        if (name && phone) {
                          setContacts([...contacts, { id: Date.now().toString(), name, phone, relation: 'Family' }]);
                        }
                      }}
                      className="px-3.5 py-2 rounded-xl bg-[#FF10F0] text-black font-extrabold text-xs shadow-[0_0_15px_#FF10F0]"
                    >
                      + Add Contact
                    </button>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {contacts.map((c) => (
                      <div key={c.id} className="glass-panel p-4 rounded-2xl border border-white/10 space-y-3">
                        <div className="flex items-center justify-between">
                          <div>
                            <h4 className="text-base font-bold text-white">{c.name}</h4>
                            <p className="text-xs text-gray-400 font-mono">{c.phone}</p>
                          </div>
                          <button onClick={() => setContacts(contacts.filter(item => item.id !== c.id))} className="text-red-400 text-xs font-bold">
                            Delete
                          </button>
                        </div>
                        <div className="grid grid-cols-3 gap-2 pt-2 border-t border-white/10">
                          <a href={`tel:${c.phone}`} className="p-2 rounded-xl bg-emerald-600/20 text-emerald-400 text-center text-xs font-bold border border-emerald-500/30">
                            Call
                          </a>
                          <a href={getSmsUrl(c.phone, createEmergencyMessage(location.latitude, location.longitude, address))} className="p-2 rounded-xl bg-blue-600/20 text-blue-400 text-center text-xs font-bold border border-blue-500/30">
                            SMS
                          </a>
                          <a href={getWhatsAppUrl(c.phone, createEmergencyMessage(location.latitude, location.longitude, address))} target="_blank" className="p-2 rounded-xl bg-[#FF10F0]/20 text-[#FF10F0] text-center text-xs font-bold border border-[#FF10F0]/30">
                            WhatsApp
                          </a>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Safety Check-in Timer Tab */}
              {activeTab === 'checkin' && (
                <div className="glass-panel p-6 rounded-2xl border border-[#FF10F0]/30 text-center space-y-4">
                  <h3 className="text-lg font-bold text-white">Safety Check-in Timer</h3>
                  <p className="text-xs text-gray-400">Set a timer for your trip. If not cancelled in time, emergency SOS triggers automatically.</p>
                  <div className="grid grid-cols-4 gap-2 max-w-sm mx-auto pt-2">
                    {[5, 15, 30, 60].map(mins => (
                      <button
                        key={mins}
                        onClick={() => alert(`Safety Timer for ${mins} minutes initiated!`)}
                        className="py-3 rounded-xl bg-white/5 hover:bg-[#FF10F0] hover:text-black border border-white/10 text-sm font-bold text-white transition-all"
                      >
                        {mins}m
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* Helplines Tab */}
              {activeTab === 'helplines' && (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {[
                    { title: "National Emergency / Police", num: "112", color: "bg-red-600" },
                    { title: "Women's Helpline", num: "1091", color: "bg-[#FF10F0] text-black" },
                    { title: "Ambulance", num: "102", color: "bg-emerald-600" },
                    { title: "Domestic Abuse", num: "181", color: "bg-amber-600" }
                  ].map((h, i) => (
                    <div key={i} className="glass-panel p-5 rounded-2xl border border-white/10 flex items-center justify-between">
                      <div>
                        <h4 className="text-base font-bold text-white">{h.title}</h4>
                        <p className="text-xl font-black text-white font-mono">{h.num}</p>
                      </div>
                      <a href={`tel:${h.num}`} className={`px-4 py-2.5 rounded-xl font-extrabold text-xs uppercase ${h.color}`}>
                        DIAL
                      </a>
                    </div>
                  ))}
                </div>
              )}

              {/* Toolkit Tab */}
              {activeTab === 'toolkit' && (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div className="glass-panel p-5 rounded-2xl border border-white/10 space-y-3">
                    <h4 className="text-base font-bold text-white">Fake Call Escape</h4>
                    <p className="text-xs text-gray-400">Simulate incoming call to exit uncomfortable situations.</p>
                    <button onClick={() => alert('Simulating Fake Incoming Call...')} className="w-full py-2.5 rounded-xl bg-purple-600 text-white font-bold text-xs">
                      Trigger Fake Call
                    </button>
                  </div>

                  <div className="glass-panel p-5 rounded-2xl border border-white/10 space-y-3">
                    <h4 className="text-base font-bold text-white">Distress Alarm Siren</h4>
                    <p className="text-xs text-gray-400">Loud dual synth alarm siren sound.</p>
                    <button onClick={toggleSiren} className="w-full py-2.5 rounded-xl bg-[#FF10F0] text-black font-extrabold text-xs">
                      {isSirenActive ? 'STOP SIREN' : 'SOUND SIREN'}
                    </button>
                  </div>
                </div>
              )}

            </main>

            {/* Emergency SOS Modal */}
            {isSosModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-xl">
                <div className="w-full max-w-lg glass-panel p-6 rounded-2xl border-2 border-[#FF10F0] space-y-4">
                  <div className="flex items-center justify-between border-b border-white/10 pb-3">
                    <h3 className="text-xl font-black text-[#FF10F0]">🚨 EMERGENCY SOS ACTIVATED</h3>
                    <button onClick={() => setIsSosModalOpen(false)} className="text-gray-400 text-xl font-bold">✕</button>
                  </div>
                  <div className="p-3 bg-black/60 rounded-xl text-xs space-y-1 font-mono">
                    <p className="text-white font-bold">{address}</p>
                    <p className="text-pink-400">Lat: {location?.latitude ?? 28.6139}, Lng: {location?.longitude ?? 77.2090}</p>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <a href={getWhatsAppUrl('', createEmergencyMessage(location?.latitude || 28.6139, location?.longitude || 77.2090, address))} target="_blank" className="p-3 rounded-xl bg-emerald-600 text-white text-center font-bold text-xs">
                      WhatsApp Share
                    </a>
                    <a href={getSmsUrl('', createEmergencyMessage(location?.latitude || 28.6139, location?.longitude || 77.2090, address))} className="p-3 rounded-xl bg-blue-600 text-white text-center font-bold text-xs">
                      SMS Share
                    </a>
                  </div>
                  <a href="tel:112" className="block w-full p-3 rounded-xl bg-[#FF10F0] text-black text-center font-extrabold text-sm shadow-[0_0_20px_#FF10F0]">
                    CALL 112 POLICE IMMEDIATELY
                  </a>
                </div>
              </div>
            )}

            {/* Bottom Mobile Tab Bar */}
            <nav className="fixed bottom-0 left-0 right-0 z-40 bg-[#050509]/95 backdrop-blur-xl border-t border-[#FF10F0]/20 py-2 px-3">
              <div className="max-w-md mx-auto flex items-center justify-around text-xs font-bold text-gray-400">
