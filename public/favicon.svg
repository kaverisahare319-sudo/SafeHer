<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="pinkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF10F0" stop-opacity="1" />
      <stop offset="60%" stop-color="#FF0080" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#050509" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF52F3" />
      <stop offset="100%" stop-color="#FF10F0" />
    </linearGradient>
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#FF10F0" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="#050509" />
  <circle cx="256" cy="256" r="220" fill="url(#pinkGlow)" opacity="0.35" />
  
  <!-- Shield Icon -->
  <path d="M256 64 L384 112 V240 C384 328.5 328.8 407.5 256 448 C183.2 407.5 128 328.5 128 240 V112 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="24" 
        stroke-linejoin="round"
        filter="url(#neonShadow)" />

  <!-- Heart / Hand Safety Silhouette in Center -->
  <path d="M256 185 C235 155 185 165 185 205 C185 240 256 295 256 295 C256 295 327 240 327 205 C327 165 277 155 256 185 Z" 
        fill="#FF10F0" 
        filter="url(#neonShadow)" />
        
  <!-- Hand pulse rays -->
  <circle cx="256" cy="235" r="95" fill="none" stroke="#FF10F0" stroke-width="6" stroke-dasharray="12 10" opacity="0.7" />
</svg>
